[pytest]
# Comprehensive pytest configuration for PHASE 5A/5B test suite

# Add src directory to Python path so cloudctl can be imported directly
pythonpath = src

# Test paths
testpaths = tests
python_files = test_*.py conftest.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Coverage settings
[coverage:run]
source = src/cloudctl
branch = true
omit =
    tests/*
    */__init__.py
    */__main__.py
    src/cloudctl/_version.py

[coverage:report]
show_missing = true
precision = 2
fail_under = 90
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING:
    pass
    @abstractmethod
    @abstractproperty

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires AWS/services)
    smoke: Smoke tests (basic functionality)
    slow: Slow tests (>1 second)
    aws: Tests requiring AWS integration
    error_handling: Error handling and edge case tests
    encryption: Encryption/decryption tests
    role_validation: Role validation tests
