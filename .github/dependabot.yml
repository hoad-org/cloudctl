version: 2
# Minimal, low-churn dependency maintenance. cloudctl has no published consumers,
# so updates are monthly and grouped into a single PR per ecosystem to avoid
# wasted CI minutes / PR drift. (Terraform updater removed — this is a Python CLI,
# not infrastructure.)
updates:
  # Python tooling + runtime deps — one grouped PR per month.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]

  # GitHub Actions used by the single CI workflow — one grouped PR per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
